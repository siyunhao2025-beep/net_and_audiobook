name: Validate skill
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'PyMuPDF>=1.24,<2' 'Pillow>=10,<13'
      - run: python skills/net-and-audiobook/scripts/self_test.py
      - run: node --check skills/net-and-audiobook/assets/site/app.js
      - run: node --check skills/net-and-audiobook/assets/site/audiobook/app.js
      - run: node --check skills/net-and-audiobook/assets/site/sw.js
      - run: node --check skills/net-and-audiobook/assets/site/reading/reader.js
      - run: python tools/check_readme.py
      - run: python skills/net-and-audiobook/scripts/release_check.py --root . --allow-readme-images
  reader-browser:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'PyMuPDF>=1.24,<2' 'Pillow>=10,<13' 'playwright>=1.50,<2'
      - run: python -m playwright install --with-deps chromium
      - run: python skills/net-and-audiobook/scripts/reader_check.py --out /tmp/reader-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-browser-qa
          path: /tmp/reader-qa

